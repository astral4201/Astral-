[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "astral-gann"
version = "1.0.0"
description = "Gann Trading Analyzer - Sacred Geometry, Planetary Cycles & Confluence Engine"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "yfinance>=0.2.18",
    "pyswisseph>=2.10",
    "fredapi>=0.5",
    "rich>=13.0",
    "click>=8.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[project.scripts]
astral = "astral.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
